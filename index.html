<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Silent Demand Finder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{

  font-family: Arial, sans-serif;

  color:#e5e7eb;
}
.container{
  max-width:600px;
  margin:40px auto;
  padding:20px;
}
h1{
  text-align:center;
  color:#22c55e;

}
input{
  width:100%;
  padding:14px;
  border-radius:8px;
  border:none;
  margin-top:20px;
  font-size:16px;
}
button{
  width:100%;
  padding:14px;
  margin-top:15px;
  background:#22c55e;
  border:none;
  border-radius:8px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;

.card{
  background:#020617;
  border-left:4px solid #22c55e;
  padding:14px;
  border-radius:8px;
  margin-top:15px;

.tag{

.score{

.footer{

</head>

<body>
<div class="container">

<div class="footer">
Free Version • Premium coming soon
</div>

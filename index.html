<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Demand Finder</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <h1>Silent Demand Finder</h1>
            </div>
            <div class="menu-toggle" onclick="toggleMenu()">
                <i class="fas fa-bars"></i>
            </div>
            <ul class="nav-menu">
                <li><a href="#home">Home</a></li>
                <li><a href="#features">Features</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
                <li><a href="admin/login.html">Admin</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero" id="home">
        <div class="hero-content">
            <h2>Discover Unspoken Market Needs</h2>
            <p>Find hidden opportunities that customers haven't explicitly requested</p>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Enter your search query...">
                <button id="searchBtn" onclick="performSearch()">
                    <i class="fas fa-search"></i> Search
                </button>
            </div>
        </div>
    </section>

    <main class="container">
        <section id="findings">
            <h2>Recent Findings</h2>
            <div id="findings-container"></div>
        </section>
    </main>

    <script src="js/menu.js"></script>
    <script src="script.js"></script>
</body>
</html>

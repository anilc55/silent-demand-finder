<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silent Demand Finder</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-nav">
  <div class="logo">🔍 Silent Demand Finder</div>

  <div class="menu-toggle" onclick="toggleMenu()">☰</div>

  <nav id="menu">
    <a href="#">Home</a>
    <a href="#">Dashboard</a>
    <a href="#">Admin</a>
    <a href="#">Monetize</a>
    <a href="#">Contact</a>
  </nav>
</header>

<section class="hero">
  <h1>Log jo search kar rahe hain</h1>
  <p>par openly bol nahi rahe</p>
</section>

<section class="search-box">
  <input id="keyword" placeholder="Example: AI, YouTube, Jobs, Kids">
  <button onclick="findDemand()">Find Real Demand</button>
</section>

<section id="results">

  <div class="card">
    <h3>Demand Type</h3>
    <p id="demandType">Hidden / Silent Search</p>
  </div>

  <div class="card">
    <h3>Intent Level</h3>
    <p id="intentLevel">High – Monetizable</p>
  </div>

  <div class="card">
    <h3>Competition</h3>
    <p id="competition">Low to Medium</p>
  </div>

  <div class="card">
    <h3>Status</h3>
    <p id="status">Real-time Logic</p>
  </div>

</section>

<footer>
  © 2026 Silent Demand Finder • Powered by AI Logic
</footer>

<script src="script.js"></script>
</body>
</html>

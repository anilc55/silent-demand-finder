<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Silent Demand Finder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --green:#22c55e;
  --dark:#020617;
  --bg:#0f172a;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#020617,#0f172a);
  color:#e5e7eb;
}

header{
  padding:20px;
  text-align:center;
  background:rgba(0,0,0,0.3);
  border-bottom:1px solid #1e293b;
}

header h1{
  margin:0;
  color:var(--green);
  font-size:26px;
}

header p{
  margin-top:6px;
  font-size:14px;
  opacity:0.85;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.search-box{
  background:#020617;
  padding:20px;
  border-radius:12px;
  box-shadow:0 0 25px rgba(34,197,94,0.15);
}

.search-box input{
  width:100%;
  padding:14px;
  font-size:16px;
  border:none;
  border-radius:8px;
  outline:none;
}

.search-box button{
  width:100%;
  margin-top:14px;
  padding:14px;
  border:none;
  border-radius:8px;
  background:var(--green);
  color:#000;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px;
  margin-top:20px;
}

.stat{
  background:#020617;
  padding:14px;
  border-radius:10px;
  border-left:4px solid var(--green);
}

.stat h3{
  margin:0;
  font-size:14px;
  color:var(--green);
}

.stat p{
  margin-top:6px;
  font-size:13px;
  opacity:0.8;
}

#results{
  margin-top:25px;
}

.card{
  background:#020617;
  padding:18px;
  margin-bottom:15px;
  border-radius:12px;
  border-left:4px solid var(--green);
}

.card .tag{
  display:inline-block;
  font-size:12px;
  color:var(--green);
  font-weight:bold;
  margin-bottom:6px;
}

.card .text{
  font-size:15px;
  margin-top:6px;
}

.card .score{
  margin-top:8px;
  font-size:12px;
  opacity:0.7;
}

footer{
  margin-top:40px;
  padding:15px;
  text-align:center;
  font-size:12px;
  opacity:0.6;
  border-top:1px solid #1e293b;
}
</style>
</head>

<body>

<header>
  <h1>🔍 Silent Demand Finder</h1>
  <p>Log jo search kar rahe hain — par openly bol nahi rahe</p>
</header>

<div class="container">

  <div class="search-box">
    <input id="keyword" placeholder="Example: AI, YouTube, Jobs, Kids">
    <button onclick="runFinder()">Find Real Demand</button>
  </div>

  <div class="stats">
    <div class="stat">
      <h3>Demand Type</h3>
      <p>Hidden + Silent Search</p>
    </div>
    <div class="stat">
      <h3>Intent Level</h3>
      <p>High Monetizable</p>
    </div>
    <div class="stat">
      <h3>Competition</h3>
      <p>Low to Medium</p>
    </div>
    <div class="stat">
      <h3>Status</h3>
      <p>Real-time Logic</p>
    </div>
  </div>

  <div id="results"></div>

</div>

<footer>
Free Tool • Premium Version Coming Soon • Built by Silent Demand Logic
</footer>

<script src="js/app.js"></script>
</body>
</html>
